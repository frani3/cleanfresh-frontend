# Clúster Kafka de Clean&Fresh (Spec 044): Zookeeper de 3 nodos y 3 brokers.
#
#   docker compose up -d      # tarda 1 a 2 minutos; kafka-init crea los tópicos al final
#
# Puertos en el host: brokers 9092, 9093 y 9094 (los usan los microservicios). Zookeeper no se publica.
# KAFKA_ADVERTISED_HOST es la dirección con la que los clientes de FUERA de Docker llegan a los brokers:
#   - en local:  localhost (valor por defecto)
#   - en AWS:    la IP privada de la EC2 cleanfresh-kafka (ver .env.example)
# Dentro de la red de Docker (Kafka-UI, kafka-init, entre brokers) se usa kafkaN:29092.
name: cleanfresh-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  networks: [kafka-net]
  healthcheck:
    test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 10
  ZOOKEEPER_SYNC_LIMIT: 5
  ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks: [kafka-net]
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 12
    start_period: 40s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Réplicas y mínimo de réplicas sincronizadas: con 3 brokers se tolera la caída de 1 sin perder escrituras (acks=all).
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
  # Los tópicos se crean a propósito (kafka-init y kafka-admin), no por accidente al publicar en un nombre mal escrito.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m

services:
  zk1:
    <<: *zookeeper
    hostname: zk1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zk1-data:/var/lib/zookeeper/data, zk1-log:/var/lib/zookeeper/log]

  zk2:
    <<: *zookeeper
    hostname: zk2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zk2-data:/var/lib/zookeeper/data, zk2-log:/var/lib/zookeeper/log]

  zk3:
    <<: *zookeeper
    hostname: zk3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zk3-data:/var/lib/zookeeper/data, zk3-log:/var/lib/zookeeper/log]

  kafka1:
    <<: *kafka
    hostname: kafka1
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    hostname: kafka2
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    hostname: kafka3
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9094
    volumes: [kafka3-data:/var/lib/kafka/data]

  # Crea (o corrige) los tópicos del sistema. Se puede repetir sin efectos: docker compose run --rm kafka-init
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    networks: [kafka-net]
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    volumes:
      - ./crear-topicos.sh:/crear-topicos.sh:ro
    environment:
      BOOTSTRAP: kafka1:29092,kafka2:29092,kafka3:29092
    entrypoint: ["bash", "/crear-topicos.sh"]

networks:
  # Nombre fijo para que Kafka-UI (otro compose) se una a la misma red.
  kafka-net:
    name: cleanfresh-kafka-net

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
