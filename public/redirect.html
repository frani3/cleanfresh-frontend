<!DOCTYPE html>
<html>
<body>
  <!--
    Cognito tiene registrado /redirect.html como callback URL de la app
    (cambiarlo implicaría reconfigurar el App Client en AWS). Pero esta
    ruta es un archivo estático que CRA sirve fuera del bundle de React,
    así que acá no hay AuthProvider montado para procesar el login.

    En vez de duplicar la lógica de oidc-client-ts en HTML plano,
    rebotamos a "/" conservando el ?code=&state= — ahí sí está montada
    la app real (con el AuthProvider) y react-oidc-context procesa el
    callback normalmente.
  -->
  <script>
    window.location.replace("/" + window.location.search);
  </script>
</body>
</html>
