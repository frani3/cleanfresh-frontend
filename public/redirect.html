<!DOCTYPE html>
<html>
<body>
  <!--
    CRA sirve public/ como archivos estáticos (no pasa por Webpack), por lo
    que un <script type="module"> con el bare specifier
    "@azure/msal-browser/redirect-bridge" no se puede resolver en el
    navegador. Usamos en su lugar el bundle UMD vendorizado por
    scripts/copy-redirect-bridge.js (ver package.json "postinstall"), que
    expone la misma función broadcastResponseToMainFrame() como global.
  -->
  <script src="/msal-redirect-bridge.min.js"></script>
  <script>
    msalRedirectBridge.broadcastResponseToMainFrame().catch(console.error);
  </script>
</body>
</html>
